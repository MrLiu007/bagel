# Bagel（贝果）— Docker Compose
#
# Quick start (from repo root, with a local .env):
#   cp .env.example .env
#   docker compose up -d --build
#   open http://localhost:8000
#
# Stack: app + Postgres (SoT) + RSSHub + FreshRSS (infra only).
# MediaCrawler is NOT in the image (gitignored / cloned on host if needed).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bagel
      POSTGRES_PASSWORD: bagel
      POSTGRES_DB: bagel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bagel -d bagel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rsshub:
    image: diygod/rsshub:latest
    environment:
      CACHE_TYPE: memory
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:1200/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  freshrss:
    image: freshrss/freshrss:latest
    environment:
      TZ: Asia/Shanghai
      CRON_MIN: "1,31"
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
    # Not exposed publicly by default; use profile "debug" below.
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    environment:
      # Force transactional Postgres inside the compose network.
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://bagel:bagel@postgres:5432/bagel
      RSSHUB_BASE_URL: http://rsshub:1200
      FRESHRSS_BASE_URL: http://freshrss
      NO_PROXY: localhost,127.0.0.1,postgres,rsshub,freshrss
      # Optional: point HTTP(S)_PROXY at host proxy for overseas / GitHub / X.
      # HTTP_PROXY: http://host.docker.internal:7890
      # HTTPS_PROXY: http://host.docker.internal:7890
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rsshub:
        condition: service_started
      freshrss:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # Optional: expose FreshRSS UI for ops
  #   docker compose --profile debug up -d
  freshrss-debug:
    profiles: ["debug"]
    image: freshrss/freshrss:latest
    network_mode: "service:freshrss"
    ports:
      - "8080:80"

volumes:
  postgres_data:
  freshrss_data:
