<div class="tabs">
  <a href="{{ u('/briefs?period=' ~ period ~ (current_month and ('&month=' ~ current_month) or '')) }}"
     class="{% if kind == 'NEWS' %}on{% endif %}">新闻</a>
  <a href="{{ u('/briefs/github?period=' ~ period ~ (current_month and ('&month=' ~ current_month) or '')) }}"
     class="{% if kind == 'GITHUB' %}on{% endif %}">项目</a>
  <a href="{{ u('/briefs/papers?period=' ~ period ~ (current_month and ('&month=' ~ current_month) or '')) }}"
     class="{% if kind == 'SCIENCE' %}on{% endif %}">论文</a>
  <a href="{{ u('/briefs/education?period=' ~ period ~ (current_month and ('&month=' ~ current_month) or '')) }}"
     class="{% if kind == 'EDUCATION' %}on{% endif %}">教育</a>
  <a href="{{ u('/briefs/models?period=' ~ period ~ (current_month and ('&month=' ~ current_month) or '')) }}"
     class="{% if kind == 'MODEL' %}on{% endif %}">模型</a>
  <a href="{{ u('/briefs/stocks?period=' ~ period ~ (current_month and ('&month=' ~ current_month) or '')) }}"
     class="{% if kind == 'STOCK' %}on{% endif %}">股票</a>
  <a href="{{ u('/briefs/media?period=' ~ period ~ (current_month and ('&month=' ~ current_month) or '')) }}"
     class="{% if kind == 'MEDIA' %}on{% endif %}">自媒体</a>
  <a href="{{ u('/briefs/av?period=' ~ period ~ (current_month and ('&month=' ~ current_month) or '')) }}"
     class="{% if kind == 'AV' %}on{% endif %}">音视频</a>
  <a href="{{ u('/briefs/space?view=board') }}"
     class="{% if kind == 'SPACE' or kind == 'DASHBOARD' %}on{% endif %}">个人空间</a>
</div>

{% if kind != 'SPACE' and kind != 'DASHBOARD' %}
<div class="tabs" style="margin-top:-0.35rem;">
  <a href="{{ u(list_url ~ '?period=month' ~ (current_month and ('&month=' ~ current_month) or '')) }}"
     class="{% if period == 'month' %}on{% endif %}">按月</a>
  <a href="{{ u(list_url ~ '?period=week' ~ (current_month and ('&month=' ~ current_month) or '')) }}"
     class="{% if period == 'week' %}on{% endif %}">按周</a>
</div>
{% endif %}
