{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
{% if message %}<p class="msg">{{ message }}</p>{% endif %}

<div class="tabs">
  {% for key, label in fav_kinds %}
  <a href="/favorites?kind={{ key }}{% if category %}&category={{ category|urlencode }}{% endif %}&page_size={{ page_size }}"
     class="{% if fav_kind == key %}on{% endif %}">{{ label }}</a>
  {% endfor %}
</div>

{% include "_items_list.html" %}
{% endblock %}
