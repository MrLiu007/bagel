# Bagel（贝果）— 挂载到已有 Nginx server { } 内
#
# 用法（ECS 上已有 80/443 站点时）：
#   1. docker compose up -d --build   # 默认监听 127.0.0.1:6280
#   2. 在域名的 server 块中：
#        include /path/to/bagel/deploy/nginx/bagel-location.conf;
#      或复制本文件内容进 server 块后 reload。
#
# 对外访问：
#   https://你的域名/bagel/
#   https://你的域名/bagel/health
#   https://你的域名/bagel/docs   （若开启 OpenAPI）
#
# 说明：
#   - Bagel 是 FastAPI + Jinja 单体，无独立「前端容器」；本 location 同时覆盖页面与 API。
#   - proxy_pass 末尾斜杠会剥离 /bagel 前缀，上游仍看到 /login、/static/…
#   - X-Forwarded-Prefix 让应用生成带 /bagel 的链接与重定向（见 web/proxy_prefix.py）
#
# 若改了宿主机端口，同步修改下方 upstream 端口（默认 BAGEL_HOST_PORT=6280）。

location = /bagel {
    return 301 /bagel/;
}

location /bagel/ {
    # 剥离 /bagel 前缀后转发到本机 Compose 映射口
    proxy_pass http://127.0.0.1:6280/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /bagel;
    proxy_set_header X-Script-Name /bagel;

    # SSE / 长任务（采集、ASR 等）勿缓冲
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 100m;
}
