# 示例：若该域名尚无站点、需要新建 HTTPS server。
# ECS 上通常已有站点 → 优先用 bagel-location.conf 嵌入现有 server，勿再抢 443。
#
# 替换：
#   - your.example.com
#   - 证书路径
#   - include 路径

server {
    listen 443 ssl http2;
    server_name your.example.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # 其它应用的 location 可与本段并列
    include /opt/bagel/deploy/nginx/bagel-location.conf;
}

server {
    listen 80;
    server_name your.example.com;
    return 301 https://$host$request_uri;
}
